[platformio]
src_dir = .

[env:nucleo_f401re]
platform = ststm32@20.0.0
board = nucleo_f401re
framework = arduino
build_src_filter = +<src/> +<extras/platformio/main.cpp>
build_flags = -Isrc
lib_deps =
    https://downloads.arduino.cc/libraries/github.com/arduino-libraries/Ethernet-2.0.2.zip
    https://downloads.arduino.cc/libraries/github.com/arduino-libraries/NTPClient-3.2.1.zip
    https://downloads.arduino.cc/libraries/github.com/OPEnSLab-OSU/SSLClient-1.6.11.zip
    https://downloads.arduino.cc/libraries/github.com/256dpi/MQTT-2.6.0.zip
